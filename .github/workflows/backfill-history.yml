name: Backfill Market History

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Optional start date, YYYY-MM-DD. Empty uses earliest archive record."
        required: false
        type: string
      to:
        description: "Optional end date, YYYY-MM-DD. Empty uses latest archive record."
        required: false
        type: string
      watchlist:
        description: "Optional watchlist path. Empty backfills all active US universe symbols."
        required: false
        type: string
      replace:
        description: "Replace target records inside the date range instead of merging"
        required: false
        type: boolean
        default: false
      stooq_archive_url:
        description: "Optional URL to a manually downloaded d_us_txt.zip archive"
        required: false
        type: string

concurrency:
  group: market-data-backfill-us
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test
        run: go test ./...

      - name: Run backfill
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          ARGS=(
            --storage r2
            --market us
            --from "${{ inputs.from }}"
            --to "${{ inputs.to }}"
          )
          if [ -n "${{ inputs.watchlist }}" ]; then
            ARGS+=(--watchlist "${{ inputs.watchlist }}")
          fi
          if [ "${{ inputs.replace }}" = "true" ]; then
            ARGS+=(--replace)
          fi
          if [ -n "${{ inputs.stooq_archive_url }}" ]; then
            curl -L --fail --retry 3 --retry-delay 5 "${{ inputs.stooq_archive_url }}" -o d_us_txt.zip
            ARGS+=(--stooq-archive-file d_us_txt.zip)
          fi
          go run ./cmd/backfill-history "${ARGS[@]}"
