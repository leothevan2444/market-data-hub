name: Sync Market Data

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to sync, YYYY-MM-DD. Defaults to today in runner UTC."
        required: false
        type: string

concurrency:
  group: market-data-sync-us
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test
        run: go test ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - name: Worker typecheck
        run: npm ci --prefix worker && npm run typecheck --prefix worker

      - name: Run sync
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: go run ./cmd/sync-daily --storage r2 --market us --date "${{ github.event.inputs.date }}"
